<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#090F20" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Acewise" />
    <meta
      name="description"
      content="Learn blackjack strategy and card counting with guided practice, offline lessons, and a virtual casino table."
    />
    <link rel="manifest" href="/manifest.json" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <title>Acewise</title>
    <!-- Expo injects the current JavaScript bundle during export. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        background-color: #090f20;
      }
      body {
        margin: 0;
        overflow: hidden;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>
  <body>
    <noscript>Turn on JavaScript to use Acewise.</noscript>
    <div id="root"></div>
  </body>
</html>
